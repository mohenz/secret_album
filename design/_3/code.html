<script>
  (function initPhotoViewer() {
    let currentIndex = 12;
    const totalIndex = 148;
    let isSlideshowPlaying = false;
    let slideshowInterval = 5000;
    let slideshowTimer = null;
    let progressTimer = null;
    let progressStart = 0;
    let isFavorited = false;
    let isInfoOpen = true; // Shown by default in desktop layout specification
    let isPrivacyMasked = false;

    // DOM References
    const viewerContainer = document.getElementById('viewer-container');
    const stageViewport = document.getElementById('stage-viewport');
    const header = document.getElementById('viewer-header');
    const topScrim = document.getElementById('top-scrim');
    const infoDrawer = document.getElementById('info-drawer');
    const privacyShield = document.getElementById('privacy-shield');
    const progressBar = document.getElementById('slideshow-progress');
    const currentIndexEl = document.getElementById('current-index');
    const totalIndexEl = document.getElementById('total-index');
    const btnPlayPause = document.getElementById('btn-slideshow');
    const slideshowIcon = document.getElementById('slideshow-icon');
    const slideshowLabel = document.getElementById('slideshow-label');
    const intervalBtn = document.getElementById('btn-interval-dropdown');
    const intervalMenu = document.getElementById('interval-menu');
    const currentIntervalLabel = document.getElementById('current-interval-label');
    const btnFavorite = document.getElementById('btn-favorite');
    const favoriteIcon = document.getElementById('favorite-icon');
    const btnToggleInfo = document.getElementById('btn-toggle-info');
    const btnCloseDrawer = document.getElementById('btn-close-drawer');
    const btnPrivacy = document.getElementById('btn-privacy');
    const privacyRestoreBtn = document.getElementById('privacy-restore-btn');
    const btnMoreOptions = document.getElementById('btn-more-options');
    const moreMenu = document.getElementById('more-menu');
    const btnCopyExif = document.getElementById('btn-copy-exif');
    const toastNotify = document.getElementById('toast-notify');
    const toastMessage = document.getElementById('toast-message');
    const btnNext = document.getElementById('btn-next');
    const btnPrev = document.getElementById('btn-prev');
    const btnClose = document.getElementById('btn-close');

    // Toast helper
    function showToast(msg) {
      toastMessage.textContent = msg;
      toastNotify.classList.remove('opacity-0');
      toastNotify.classList.add('opacity-100');
      setTimeout(() => {
        toastNotify.classList.remove('opacity-100');
        toastNotify.classList.add('opacity-0');
      }, 2200);
    }

    // Index & Progress Update
    function updateCounter() {
      currentIndexEl.textContent = currentIndex;
      const pct = (currentIndex / totalIndex) * 100;
      progressBar.style.width = pct + '%';
    }

    // Navigation
    function goNext() {
      currentIndex = currentIndex >= totalIndex ? 1 : currentIndex + 1;
      updateCounter();
      resetSlideshowProgress();
    }

    function goPrev() {
      currentIndex = currentIndex <= 1 ? totalIndex : currentIndex - 1;
      updateCounter();
      resetSlideshowProgress();
    }

    btnNext.addEventListener('click', goNext);
    btnPrev.addEventListener('click', goPrev);

    // Favorite Toggle
    btnFavorite.addEventListener('click', () => {
      isFavorited = !isFavorited;
      if (isFavorited) {
        favoriteIcon.style.fontVariationSettings = "'FILL' 1";
        btnFavorite.classList.add('text-error');
        btnFavorite.classList.remove('text-outline');
        showToast('보관함 즐겨찾기에 등록되었습니다');
      } else {
        favoriteIcon.style.fontVariationSettings = "'FILL' 0";
        btnFavorite.classList.remove('text-error');
        btnFavorite.classList.add('text-outline');
        showToast('즐겨찾기에서 제거되었습니다');
      }
    });

    // Info Drawer Toggle
    function toggleInfoDrawer(forceState) {
      isInfoOpen = typeof forceState === 'boolean' ? forceState : !isInfoOpen;
      if (isInfoOpen) {
        infoDrawer.classList.remove('translate-x-full');
        infoDrawer.classList.add('translate-x-0');
        btnToggleInfo.classList.add('bg-primary', 'text-on-primary');
        btnToggleInfo.classList.remove('bg-surface-container-low/50', 'text-outline');
        // On large desktop, shift stage slightly left for balance
        if (window.innerWidth >= 1280) {
          stageViewport.style.marginRight = '24rem';
        }
      } else {
        infoDrawer.classList.add('translate-x-full');
        infoDrawer.classList.remove('translate-x-0');
        btnToggleInfo.classList.remove('bg-primary', 'text-on-primary');
        btnToggleInfo.classList.add('bg-surface-container-low/50', 'text-outline');
        stageViewport.style.marginRight = '0px';
      }
    }

    btnToggleInfo.addEventListener('click', () => toggleInfoDrawer());
    btnCloseDrawer.addEventListener('click', () => toggleInfoDrawer(false));

    // Slideshow Logic
    function startSlideshow() {
      isSlideshowPlaying = true;
      slideshowIcon.textContent = 'pause';
      slideshowLabel.textContent = '일시정지';
      progressStart = Date.now();

      progressTimer = setInterval(() => {
        const elapsed = Date.now() - progressStart;
        const progressRate = Math.min((elapsed / slideshowInterval) * 100, 100);
        progressBar.style.width = progressRate + '%';
      }, 50);

      slideshowTimer = setInterval(() => {
        goNext();
        progressStart = Date.now();
      }, slideshowInterval);
    }

    function pauseSlideshow() {
      isSlideshowPlaying = false;
      slideshowIcon.textContent = 'play_arrow';
      slideshowLabel.textContent = '슬라이드';
      clearInterval(slideshowTimer);
      clearInterval(progressTimer);
      const basePct = (currentIndex / totalIndex) * 100;
      progressBar.style.width = basePct + '%';
    }

    function resetSlideshowProgress() {
      if (isSlideshowPlaying) {
        clearInterval(slideshowTimer);
        clearInterval(progressTimer);
        progressStart = Date.now();
        progressTimer = setInterval(() => {
          const elapsed = Date.now() - progressStart;
          const progressRate = Math.min((elapsed / slideshowInterval) * 100, 100);
          progressBar.style.width = progressRate + '%';
        }, 50);
        slideshowTimer = setInterval(() => {
          goNext();
          progressStart = Date.now();
        }, slideshowInterval);
      }
    }

    btnPlayPause.addEventListener('click', () => {
      if (isSlideshowPlaying) {
        pauseSlideshow();
      } else {
        startSlideshow();
      }
    });

    // Slideshow Interval Dropdown
    intervalBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      intervalMenu.classList.toggle('hidden');
    });

    document.querySelectorAll('.interval-opt').forEach((opt) => {
      opt.addEventListener('click', (e) => {
        e.stopPropagation();
        const duration = parseInt(opt.getAttribute('data-interval'), 10);
        slideshowInterval = duration;
        currentIntervalLabel.textContent = duration / 1000 + 's';
        intervalMenu.classList.add('hidden');

        // Update styling
        document.querySelectorAll('.interval-opt').forEach((b) => {
          b.classList.remove('bg-surface-container', 'text-primary');
          b.classList.add('text-on-surface');
          const chk = b.querySelector('.check-indicator');
          if (chk) chk.classList.add('opacity-0');
        });
        opt.classList.add('bg-surface-container', 'text-primary');
        const activeChk = opt.querySelector('.check-indicator');
        if (activeChk) activeChk.classList.remove('opacity-0');

        if (isSlideshowPlaying) {
          resetSlideshowProgress();
        }
      });
    });

    // More Context Menu
    btnMoreOptions.addEventListener('click', (e) => {
      e.stopPropagation();
      moreMenu.classList.toggle('hidden');
    });

    // Quick Privacy Masking Mode
    function togglePrivacyShield(force) {
      isPrivacyMasked = typeof force === 'boolean' ? force : !isPrivacyMasked;
      if (isPrivacyMasked) {
        privacyShield.classList.remove('opacity-0', 'pointer-events-none');
        privacyShield.classList.add('opacity-100', 'pointer-events-auto');
        if (isSlideshowPlaying) pauseSlideshow();
      } else {
        privacyShield.classList.add('opacity-0', 'pointer-events-none');
        privacyShield.classList.remove('opacity-100', 'pointer-events-auto');
      }
    }

    btnPrivacy.addEventListener('click', () => togglePrivacyShield(true));
    privacyRestoreBtn.addEventListener('click', () => togglePrivacyShield(false));
    privacyShield.addEventListener('click', () => togglePrivacyShield(false));

    // EXIF Copy
    btnCopyExif.addEventListener('click', () => {
      const exifSummary = "Sony α7 IV · FE 85mm F1.4 GM · 1/250s, f/2.0, ISO 200, 85mm · 7008x4672 RAW";
      navigator.clipboard.writeText(exifSummary).then(() => {
        moreMenu.classList.add('hidden');
        showToast("EXIF 정보가 복사되었습니다");
      }).catch(() => {
        showToast("클립보드 접근 권한이 필요합니다");
      });
    });

    // Global Dismiss on Outside Click
    window.addEventListener('click', (e) => {
      if (!intervalMenu.contains(e.target) && e.target !== intervalBtn) {
        intervalMenu.classList.add('hidden');
      }
      if (!moreMenu.contains(e.target) && e.target !== btnMoreOptions) {
        moreMenu.classList.add('hidden');
      }
    });

    // Keyboard Hotkey Navigation
    window.addEventListener('keydown', (e) => {
      if (isPrivacyMasked) {
        togglePrivacyShield(false);
        return;
      }

      switch (e.key) {
        case 'ArrowRight':
        case 'ArrowDown':
          goNext();
          break;
        case 'ArrowLeft':
        case 'ArrowUp':
          goPrev();
          break;
        case ' ':
          e.preventDefault();
          if (isSlideshowPlaying) pauseSlideshow();
          else startSlideshow();
          break;
        case 'i':
        case 'I':
          toggleInfoDrawer();
          break;
        case 'h':
        case 'H':
          togglePrivacyShield(true);
          break;
        case 'Escape':
          if (isInfoOpen && window.innerWidth < 1024) {
            toggleInfoDrawer(false);
          } else {
            showToast('앨범 목록으로 돌아갑니다');
          }
          break;
      }
    });

    // Auto-fade Header on Inactivity (Nocturnal Darkroom Spec)
    let idleTimer;
    function resetIdleTimer() {
      header.style.opacity = '1';
      topScrim.style.opacity = '1';
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        if (!isInfoOpen && !intervalMenu.classList.contains('hidden') === false) {
          header.style.opacity = '0';
          topScrim.style.opacity = '0';
        }
      }, 4000);
    }

    viewerContainer.addEventListener('mousemove', resetIdleTimer);
    viewerContainer.addEventListener('touchstart', resetIdleTimer);

    // Close Button Action
    btnClose.addEventListener('click', () => {
      showToast('앨범 홈으로 복귀합니다');
    });

    // Initial stage alignment based on default drawer state
    if (window.innerWidth >= 1280 && isInfoOpen) {
      stageViewport.style.marginRight = '24rem';
    }
  })();
</script></main>

</body></html>
