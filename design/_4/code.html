d":"1rem","gutter-loose":"1.5rem","space-sm":"0.5rem","space-xs":"0.25rem"},"fontFamily":{"headline-sm":["Geist"],"body-lg":["Geist"],"headline-lg-mobile":["Geist"],"display-hero-mobile":["Geist"],"headline-md":["Geist"],"headline-lg":["Geist"],"label-sm":["Geist"],"body-md":["Geist"],"display-hero":["Geist"],"label-md":["Geist"]},"fontSize":{"headline-sm":["18px",{"lineHeight":"26px","letterSpacing":"-0.01em","fontWeight":"500"}],"body-lg":["16px",{"lineHeight":"26px","letterSpacing":"0em","fontWeight":"400"}],"headline-lg-mobile":["26px",{"lineHeight":"34px","letterSpacing":"-0.01em","fontWeight":"400"}],"display-hero-mobile":["36px",{"lineHeight":"44px","letterSpacing":"-0.02em","fontWeight":"300"}],"headline-md":["24px",{"lineHeight":"32px","letterSpacing":"-0.015em","fontWeight":"400"}],"headline-lg":["36px",{"lineHeight":"44px","letterSpacing":"-0.02em","fontWeight":"400"}],"label-sm":["10px",{"lineHeight":"14px","letterSpacing":"0.08em","fontWeight":"500"}],"body-md":["14px",{"lineHeight":"22px","letterSpacing":"0.005em","fontWeight":"400"}],"display-hero":["56px",{"lineHeight":"64px","letterSpacing":"-0.03em","fontWeight":"300"}],"label-md":["12px",{"lineHeight":"16px","letterSpacing":"0.04em","fontWeight":"500"}]}}}};</script></head><body class="bg-surface text-on-surface antialiased selection:bg-primary-container selection:text-on-primary-container"><main class="w-full min-h-screen flex items-center justify-center bg-surface"><div class="flex flex-col w-full">
<div class="relative w-full min-h-[92vh] flex flex-col justify-between items-center px-4 sm:px-6 py-8 sm:py-12 bg-surface-container-lowest overflow-hidden select-none">
<div class="absolute inset-0 pointer-events-none opacity-40 bg-[radial-gradient(circle_at_50%_42%,rgba(77,142,255,0.06),transparent_65%)]"></div>
<header class="w-full max-w-5xl flex items-center justify-between text-on-surface-variant z-10"><div class="flex items-center gap-2"><span class="inline-block w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></span></div><button aria-label="화면 숨김" class="group flex items-center justify-center w-8 h-8 rounded-full bg-surface-container hover:bg-surface-container-high transition-colors" id="quickMaskBtn" type="button"><span class="material-symbols-outlined text-[16px] text-outline group-hover:text-primary transition-colors">visibility_off</span></button></header>
<main class="w-full max-w-[460px] my-auto py-10 z-10 flex flex-col items-center">
<div class="relative mb-8 flex items-center justify-center">
<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center shadow-inner">
<span class="material-symbols-outlined text-[28px] text-primary transition-transform duration-300" id="lockGlyph">lock</span>
</div>
<div class="absolute -bottom-1 -right-1 w-5 h-5 rounded-full bg-surface-container-high flex items-center justify-center">
<span class="material-symbols-outlined text-[12px] text-primary">verified_user</span>
</div>
</div>
<div class="text-center mb-8"><h1 class="font-headline-lg text-headline-lg text-on-surface font-light tracking-tight">비밀앨범</h1></div>
<div class="w-full p-6 sm:p-7 rounded-lg bg-surface-container shadow-2xl relative">
<form class="flex flex-col gap-5" id="vaultUnlockForm" onsubmit="event.preventDefault(); handleUnlock();">
<div class="flex flex-col gap-2">

<div class="relative flex items-center">
<input autocomplete="current-password" class="w-full h-12 px-4 pr-12 rounded bg-surface-container-lowest text-on-surface font-body-lg text-body-lg placeholder:text-outline/60 focus:outline-none focus:ring-1 focus:ring-primary-container transition-all" id="vaultKeyInput" inputmode="text" placeholder="비밀번호" required="" type="password">
<button aria-label="비밀번호 표시 토글" class="absolute right-3 p-1.5 text-outline hover:text-on-surface transition-colors flex items-center justify-center" id="toggleMaskBtn" tabindex="-1" type="button">
<span class="material-symbols-outlined text-[20px]" id="toggleMaskIcon">visibility</span>
</button>
</div>
</div>
<div class="hidden flex items-start gap-2 p-3 rounded bg-surface-container-high transition-opacity" id="alertFeedback">
<span class="material-symbols-outlined text-[18px] text-error mt-0.5" id="feedbackIcon">error</span>
<span class="font-label-md text-label-md text-on-surface leading-snug" id="feedbackText"></span>
</div>
<button class="relative w-full h-11 px-6 rounded bg-primary-container hover:bg-secondary-container active:scale-[0.99] text-on-primary font-headline-sm text-body-md flex items-center justify-center gap-2 transition-all font-medium" id="unlockSubmitBtn" type="submit">
<span class="material-symbols-outlined text-[18px]">lock_open</span>
<span class="">잠금 해제</span>
</button>
</form>

</div>

</main>
<footer class="w-full max-w-5xl flex flex-col sm:flex-row items-center justify-between gap-3 text-center sm:text-left z-10 pt-4"><div class="w-full text-center text-outline/60 font-label-sm text-label-sm tracking-widest uppercase">© MONOGRAPH ARCHIVE</div></footer>
<div class="fixed inset-0 bg-surface-container-lowest z-50 hidden flex-col items-center justify-center p-6 text-center select-none cursor-pointer" id="blankMaskLayer">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center mb-4">
<span class="material-symbols-outlined text-[24px] text-outline">security</span>
</div>
<p class="font-headline-sm text-headline-sm text-on-surface font-light mb-1">프라이버시 블라인드 활성화</p>
<p class="font-label-md text-label-md text-outline">임의 키를 누르거나 화면을 클릭하여 복귀합니다.</p>
</div>
</div>
<script>
    (function initSecurityLockScreen() {
      const form = document.getElementById('vaultUnlockForm');
      const keyInput = document.getElementById('vaultKeyInput');
      const toggleMaskBtn = document.getElementById('toggleMaskBtn');
      const toggleMaskIcon = document.getElementById('toggleMaskIcon');
      const lockGlyph = document.getElementById('lockGlyph');
      const feedback = document.getElementById('alertFeedback');
      const feedbackText = document.getElementById('feedbackText');
      const feedbackIcon = feedback ? document.getElementById('feedbackIcon') : null;
      const maskLayer = document.getElementById('blankMaskLayer');
      const quickMaskBtn = document.getElementById('quickMaskBtn');
      const noticeTrigger = document.getElementById('authNoticeTrigger');

      let isMaskActive = false;

      function toggleBlind() {
        isMaskActive = !isMaskActive;
        if (maskLayer) {
          if (isMaskActive) {
            maskLayer.classList.remove('hidden');
            maskLayer.classList.add('flex');
          } else {
            maskLayer.classList.add('hidden');
            maskLayer.classList.remove('flex');
          }
        }
      }

      window.addEventListener('keydown', (e) => {
        if (e.shiftKey && (e.key === 'H' || e.key === 'h')) {
          e.preventDefault();
          toggleBlind();
        } else if (isMaskActive) {
          toggleBlind();
        }
      });

      if (quickMaskBtn) {
        quickMaskBtn.addEventListener('click', () => toggleBlind());
      }

      if (maskLayer) {
        maskLayer.addEventListener('click', () => {
          if (isMaskActive) toggleBlind();
        });
      }

      if (toggleMaskBtn && keyInput && toggleMaskIcon) {
        toggleMaskBtn.addEventListener('click', () => {
          const isPass = keyInput.type === 'password';
          keyInput.type = isPass ? 'text' : 'password';
          toggleMaskIcon.textContent = isPass ? 'visibility_off' : 'visibility';
        });
      }

      if (noticeTrigger) {
        noticeTrigger.addEventListener('click', () => {
          showFeedback('로컬 보관소 세션은 무활동 5분 경과 후 자동 락업됩니다.', false);
        });
      }

      function showFeedback(msg, isError) {
        if (!feedback || !feedbackText) return;
        feedbackText.textContent = msg;
        if (feedbackIcon) {
          feedbackIcon.textContent = isError ? 'error' : 'verified';
          feedbackIcon.className = 'material-symbols-outlined text-[18px] ' + (isError ? 'text-error' : 'text-primary');
        }
        feedback.classList.remove('hidden');
      }

      window.handleUnlock = function() {
        const val = keyInput ? keyInput.value.trim() : '';
        if (!val) {
          showFeedback('접속 비밀번호를 입력해 주십시오.', true);
          keyInput?.focus();
          return;
        }

        if (lockGlyph) {
          lockGlyph.classList.add('animate-bounce');
        }

        setTimeout(() => {
          if (val === '0000' || val.length >= 4) {
            showFeedback('인증 확인됨. 갤러리 보안 영역을 복호화합니다...', false);
            if (lockGlyph) {
              lockGlyph.classList.remove('animate-bounce');
              lockGlyph.textContent = 'lock_open';
            }
            setTimeout(() => {
              if (feedbackText) feedbackText.textContent = '아카이브 세션 로드 중...';
            }, 600);
          } else {
            if (lockGlyph) {
              lockGlyph.classList.remove('animate-bounce');
            }
            showFeedback('비밀번호가 올바르지 않습니다. 보안 로그에 시도가 기록됩니다.', true);
            if (keyInput) {
              keyInput.value = '';
              keyInput.focus();
            }
          }
        }, 400);
      };
    })();
  </script>
</div></main>

</body></html>
